[package]
name = "tquic_tools"
version = "1.6.0"
edition = "2024"
rust-version = "1.90.0"
license = "Apache-2.0"
repository = "https://github.com/tencent/tquic"
homepage = "https://tquic.net"
description = "TQUIC client and server tools"
keywords = ["quic"]
categories = ["network-programming"]

[dependencies]
bytes = "1"
url = "2.5"
log = { version = "0.4", features = ["std"] }
mio = { version = "1", features = ["net", "os-poll"] }
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
rustc-hash = "2"
slab = "0.4"
rand = "0.9"
statrs = "0.18"
signal-hook = "0.3"
tquic-mimic-chromium-client = { path = ".." }
flate2 = { version = "1.1" }
brotli = { version = "8.0" }
zstd = { version = "0.13" }

[target."cfg(unix)".dependencies]
jemallocator = { version = "0.6", package = "tikv-jemallocator" }

[lib]
crate-type = ["lib"]
path = "src/common.rs"

[[bin]]
name="tquic_client"
path="src/bin/tquic_client.rs"
