[package]
name = "tquic-mimic-chromium-client"
version = "1.6.0"
edition = "2024"
rust-version = "1.90.0"
license = "Apache-2.0"
repository = "https://github.com/jay-l-e-e/tquic"
homepage = "https://github.com/jay-l-e-e/tquic"
description = "A high-performance, lightweight, and cross-platform QUIC client that mimics chromium network stack"
keywords = ["quic"]
categories = ["network-programming"]
build = "src/build.rs"
include = [
    "/*.md",
    "/*.toml",
    "/LICENSE",
    "/src",
    "/benches",
    "/include",
    "/deps/boringssl/**/*.[chS]",
    "/deps/boringssl/**/*.asm",
    "/deps/boringssl/src/**/*.cc",
    "/deps/boringssl/**/CMakeLists.txt",
    "/deps/boringssl/**/sources.cmake",
    "/deps/boringssl/LICENSE",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["qlog", "h3"]

[features]
default = ["qlog", "h3"]

# build the FFI API
ffi = []

# enable support for the qlog
qlog = ["dep:serde", "dep:serde_json", "dep:serde_derive", "dep:serde_with"]

# enable support for h3
h3 = ["dep:sfv"]

[dependencies]
bytes = "1"
rustc-hash = "2"
slab = "0.4"
enumflags2 = "0.7"
ring = "0.17"
libc = "0.2"
lazy_static = "1"
log = { version = "0.4", features = ["std"] }
strum = "0.27"
strum_macros = "0.27"
rand = "0.9"
smallvec = { version = "1.15", features = ["serde", "union"] }
lru = "0.16"
serde = { version = "1.0", features = ["derive"], optional=true }
serde_json = { version = "1.0", features = ["preserve_order"], optional=true }
serde_derive = { version = "1.0", optional=true }
serde_with = { version="3.14", optional=true }
hex = "0.4"
priority-queue = "2.7"
sfv = { version = "0.14", optional=true }
brotli = "8.0.1"
flate2 = "1.1.2"

[target."cfg(windows)".dependencies]
winapi = { version = "0.3", features = ["wincrypt", "ws2def", "ws2ipdef", "ws2tcpip"] }

[dev-dependencies]
env_logger = "0.11"
mio = { version = "1", features = ["net", "os-poll"] }
tempfile = "3.5.0"
ctor = "0.6"
criterion = "0.7"
timer_heap = "0.3.0"

[build-dependencies]
cmake = "0.1"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[workspace]
members = ["tools"]

[[bench]]
name = "timer_queue"
harness = false
